name: Windows Build (CMake + vcpkg)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg ${{github.workspace}}\vcpkg

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies
        run: |
          .\vcpkg\vcpkg install glfw3 freetype assimp --triplet x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release

      - name: Show glad.c contents
        run: |
          echo "---- FIRST 20 LINES ----"
          sed -n '1,20p' src/glad.c

          echo "---- WITH LINE NUMBERS ----"
          nl -ba src/glad.c | head -n 20

          echo "---- RAW BYTES (IMPORTANT) ----"
          xxd -l 64 src/glad.c

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sse3-windows
          path: build/Release/