name: windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg ${{github.workspace}}\vcpkg

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Cache installed packages
        id: cache-pkgs
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}\vcpkg\installed
          key: vcpkg-pkgs-x64-windows-glfw3-freetype-assimp
          save-always: true

      - name: Install dependencies
        if: steps.cache-pkgs.outputs.cache-hit != 'true'
        run: |
          .\vcpkg\vcpkg install glfw3 freetype assimp --triplet x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DVCPKG_INSTALLED_DIR=${{github.workspace}}\vcpkg\installed

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sse3-windows
          path: build/Release/