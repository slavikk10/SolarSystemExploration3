name: windows and linux (ubuntu) build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg ${{github.workspace}}\vcpkg

      - name: Bootstrap vcpkg
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Cache installed packages
        id: cache-pkgs
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}\vcpkg\installed
          key: vcpkg-pkgs-x64-windows-glfw3-freetype-assimp

      - name: Install dependencies
        if: steps.cache-pkgs.outputs.cache-hit != 'true'
        run: |
          .\vcpkg\vcpkg install glfw3 freetype assimp --triplet x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DVCPKG_INSTALLED_DIR=${{github.workspace}}\vcpkg\installed

      - name: Build
        run: cmake --build build --config Release

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{github.workspace}}\vcpkg\installed
          key: vcpkg-pkgs-x64-windows-glfw3-freetype-assimp

      - name: Add asan dll
        run: |
          ASAN=$(clang -print-file-name=clang_rt.asan_dynamic-x86_64.dll
          cp "$ASAN" build/Release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sse3-windows
          path: build/Release/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libfreetype-dev libassimp-dev libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Bundle libraries and resources
        run: |
          cp /usr/lib/x86_64-linux-gnu/libglfw.so.3 build/
          cp /usr/lib/x86_64-linux-gnu/libassimp.so.5 build/
          cp /usr/lib/x86_64-linux-gnu/libfreetype.so.6 build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sse3-linux
          path: build/